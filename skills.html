      <h2>特技的基本规则</h2>
      <ul>
        <li>游戏开始前可以<b>选择 1 个特技</b>。</li>
        <li>特技<b>需要消耗奥义点</b>才能释放，援助则不需要。</li>
        <li>双方的<b>特技会在战斗开始时公开</b>。</li>
        <li>特技各自拥有<b>不同的冷却</b>。</li>
        <li>奥义点：技能命中时获得，上限 <b>6</b>，开局获得 <b>2 个</b>，达到上限才能使用大招。</li>
      </ul>
      <p class="muted" style="margin-top:10px;">已编写的特技会按系列展示在下方详情页中。你可以在 <code>E:\同人游戏制作开发\《咒术回战》系列特技设计</code> 目录里继续编写新的特技。</p>
