<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>对决中 - 同人棋盘对决</title>
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="battle.css">
  <link rel="stylesheet" href="mobile.css?v=9">
  <script src="mode.js?v=9"></script>
</head>
<body class="battle-page">
  <button class="menu-btn small" id="nl-open" style="position:fixed;right:10px;bottom:52px;z-index:999;">🌐 联机大厅</button>
  <div id="battle-top">
    <a class="menu-btn small" href="index.html">🏠 返回主菜单</a>
    <span class="round-info" id="round-info">第 1 轮<span class="version-tag" id="version-tag">v6</span><span class="version-tag" id="diff-tag">难度 简单</span><span class="version-tag" id="zoom-tag">🔍 100%</span></span>
    <div style="display:flex;gap:8px;align-items:center;">
      <button class="menu-btn small zoom-btn" id="zoom-out">➖</button>
      <button class="menu-btn small zoom-btn" id="zoom-in">➕</button>
      <button class="menu-btn small zoom-btn" id="zoom-reset">⤢</button>
      <button class="menu-btn small" id="btn-ai-toggle" style="display:none;">🤖 AI：关</button>
      <button class="menu-btn small" id="btn-reset-hp" style="display:none;">🔄 重置血量</button>
      <button class="menu-btn small" id="btn-reset-pos" style="display:none;">📍 重置位置</button>
      <button class="menu-btn small" id="btn-inf-sp" style="display:none;">♾ 技能点</button>
      <button class="menu-btn small" id="btn-toggle-left">🕹 状态/移动面板</button>
      <button class="menu-btn small" id="btn-toggle-right">⚡ 技能面板</button>
      <button class="menu-btn small" id="btn-end-round">⏭ 结束回合</button>
    </div>
  </div>

  <main id="battle-main">
    <!-- 左半边：状态区块 + 移动区块 -->
    <section class="left-col">
      <div class="panel" id="status-panel">
        <h3>📊 状态区块</h3>
        <div id="status-body"></div>
      </div>

      <div class="panel">
        <h3>🕹 移动区块</h3>
        <div class="pad-label">单格移动（控制我方角色）</div>
        <div class="pad-grid" id="move-pad">
          <span></span><button class="pad-btn" id="m-up">↑</button><span></span>
          <button class="pad-btn" id="m-left">←</button><span></span><button class="pad-btn" id="m-right">→</button>
          <span></span><button class="pad-btn" id="m-down">↓</button><span></span>
        </div>
        <div class="pad-label">技能释放方向（转向范围轮盘）</div>
        <div class="pad-grid" id="dir-pad">
          <span></span><button class="pad-btn" id="d-n">↑</button><span></span>
          <button class="pad-btn" id="d-w">←</button><span></span><button class="pad-btn" id="d-e">→</button>
          <span></span><button class="pad-btn" id="d-s">↓</button><span></span>
        </div>
        <div class="pad-label">当前朝向：<span class="cur-dir" id="cur-dir">上</span>（苍·最大功率等定向技能按此转向）</div>
        <div class="pad-label">角色选中</div>
        <div class="chip-row" style="gap:8px;">
          <span class="chip" id="sel-me">我方角色</span>
          <span class="chip" id="sel-enemy">敌方角色</span>
        </div>
        <div class="pad-label" style="color:var(--muted);">* 按住中间地图拖动可平移查看；轻点单位可选中</div>
      </div>
    </section>

    <!-- 中央：地图 -->
    <section class="map-block">
      <canvas id="board"></canvas>
      <div id="enemy-strip">
        <span class="e-label">敌方 <b id="enemy-name">—</b></span>
        <div class="hp-bar-wrap mini"><div class="hp-bar enemy" id="enemy-hp-bar"></div></div>
        <span id="enemy-hp-text">—</span>
      </div>
      <canvas id="minimap"></canvas>
      <div id="toast"></div>
    </section>

    <!-- 右半边：技能区块 -->
    <section class="right-col">
      <div class="panel" style="flex:1;">
        <h3>⚡ 技能区块</h3>
        <div class="skill-list" id="skill-list"></div>
        <p class="muted" style="margin-top:10px;font-size:.8rem;">注：技能按角色设定消耗技能点（六眼被动→消耗变为1）；用技能后本轮不能移动，但可继续释放其它技能；普攻/格挡每轮各1次。</p>
      </div>
    </section>
  </main>

  <div class="modal-mask hidden" id="net-lobby" style="z-index:200;">
    <div class="modal" style="width:min(560px,94vw);text-align:left;">
      <h2 style="text-align:center;">🌐 联机大厅</h2>
      <p class="muted" style="text-align:center;font-size:.86rem;">无需服务器：交换两段连接码即可直连（回合制实时同步）</p>
      <div style="display:flex;gap:10px;justify-content:center;margin:12px 0;">
        <button class="menu-btn small" id="nl-host">🏠 创建房间（我是房主）</button>
        <button class="menu-btn small" id="nl-guest">🚪 加入房间（我是加入方）</button>
      </div>
      <div id="nl-body" style="font-size:.88rem;line-height:1.7;"></div>
      <p id="nl-status" style="margin-top:10px;color:#a7e98c;min-height:1.4em;"></p>
      <div style="text-align:center;margin-top:8px;">
        <a class="menu-btn small" href="index.html">← 返回主菜单</a>
      </div>
    </div>
  </div>

  <script src="data/gamedata.js?v=9"></script>
  <script src="data/maps.js?v=9"></script>
  <script src="data/skills.js?v=9"></script>
  <script src="data/ranges.js?v=9"></script>
  <script src="net.js?v=9"></script>
  <script src="battle.js?v=9"></script>

  <div class="modal-mask hidden" id="game-over">
    <div class="modal">
      <h2 id="game-over-msg">对局结束</h2>
      <p>选择继续挑战或返回主菜单</p>
      <button class="menu-btn small" style="margin-bottom:10px;" onclick="location.reload()">🔄 再来一局</button>
      <a class="menu-btn small" href="index.html" style="display:inline-flex;">🏠 返回主菜单</a>
    </div>
  </div>
</body>
</html>
