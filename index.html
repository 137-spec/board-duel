<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>同人棋盘对决</title>
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="mobile.css?v=9">
  <script src="mode.js?v=9"></script>
</head>
<body>
  <main class="menu">
    <p class="site-disclaimer">角色设定与技能来源于各个作品，仅供同人娱乐，如果有侵权追究必删。</p>
    <h1 class="game-title">同人棋盘对决</h1>
    <p class="coin-display">💰 金币数：<span id="coin">0</span></p>
    <div class="mode-picker">
      <span class="mp-label">显示模式：</span>
      <button type="button" data-mode="pc">🖥 电脑模式</button>
      <button type="button" data-mode="phone">📱 手机模式</button>
      <button type="button" data-rotate>🔄 横屏 / 竖屏</button>
    </div>

    <nav class="menu-list">
      <a class="menu-btn" href="game.html">⚔️ 开始游戏</a>
      <a class="menu-btn" href="rules.html">📜 规则说明</a>
      <a class="menu-btn" href="assists.html">🛡️ 援助介绍</a>
      <a class="menu-btn" href="skills.html">✨ 特技介绍</a>
      <a class="menu-btn" href="characters.html">👤 角色介绍</a>
      <a class="menu-btn" href="training.html">🏋️ 训练营</a>
      <button class="menu-btn" data-action="soon">🌟 挑战模式</button>
      <a class="menu-btn" href="settings.html">⚙️ 设置</a>
    </nav>
  </main>

  <div class="modal-mask hidden" id="modal">
    <div class="modal">
      <h2>⏳ 敬请期待</h2>
      <p>该功能正在开发中，完成后再来体验吧！</p>
      <button class="menu-btn small" id="modal-close">知道了</button>
    </div>
  </div>

  <!-- 数据文件（由 convert.bat 生成，修改 txt 后需重新转换） -->
  <script src="data/gamedata.js?v=9"></script>
  <script src="data/maps.js?v=9"></script>
  <script src="data/skills.js?v=9"></script>
  <script src="main.js?v=9"></script>
  <script>
    // 主界面金币：读取兑换码/游戏内存下的金币
    (function () {
      try {
        var c = parseInt(localStorage.getItem('boardDuelCoins') || '0', 10) || 0;
        var el = document.getElementById('coin');
        if (el) el.textContent = c;
      } catch (e) {}
    })();
  </script>
</body>
</html>
