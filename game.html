<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>单人对决 - 同人棋盘对决</title>
  <link rel="stylesheet" href="style.css?v=9">
  <link rel="stylesheet" href="pages.css?v=9">
  <link rel="stylesheet" href="mobile.css?v=9">
  <script src="mode.js?v=9"></script>
</head>
<body class="content-page">
  <div class="wrap">
    <header class="page-header">
      <a class="menu-btn small" href="index.html">← 返回主菜单</a>
      <span class="page-title">单人对决</span>
    </header>

    <div class="step-nav" id="step-nav">第 1 步 / 共 4 步：选择模式</div>

    <!-- 第 0 步：模式选择 -->
    <section class="step-box" id="step-mode">
      <h2 style="color:var(--gold);">选择模式</h2>
      <div class="option-grid" id="mode-grid"></div>
    </section>

    <!-- 第 1 步：地图选择 -->
    <section class="step-box hidden" id="step-map">
      <h2 style="color:var(--gold);">选择地图</h2>
      <div class="option-grid" id="map-grid"></div>
    </section>

    <!-- 第 2 步：角色选择 -->
    <section class="step-box hidden" id="step-char">
      <h2 style="color:var(--gold);">选择我方角色</h2>
      <div class="option-grid" id="char-grid"></div>
      <div class="detail-box" id="char-detail">点击角色卡片查看详情</div>
      <button class="menu-btn" id="btn-to-loadout" disabled>下一步：选择特技与援助 →</button>
    </section>

    <!-- 第 3 步：特技与援助 -->
    <section class="step-box hidden" id="step-loadout">
      <h2 style="color:var(--gold);">选择 AI 难度</h2>
      <div class="chip-row" id="diff-chips"></div>
      <h2 style="color:var(--gold); margin-top:6px;">选择敌方角色（1 个）</h2>
      <div class="chip-row" id="enemy-chips"></div>
      <h2 style="color:var(--gold); margin-top:6px;">选择特技（1 个）— 我方</h2>
      <div class="chip-row" id="special-chips"></div>
      <h2 style="color:var(--gold); margin-top:6px;">选择援助（2 个）— 我方</h2>
      <div class="chip-row" id="assist-chips"></div>
      <h2 style="color:var(--gold); margin-top:6px;">选择特技（1 个）— 敌方</h2>
      <div class="chip-row" id="enemy-special-chips"></div>
      <h2 style="color:var(--gold); margin-top:6px;">选择援助（2 个）— 敌方</h2>
      <div class="chip-row" id="enemy-assist-chips"></div>
      <div class="detail-box" id="loadout-summary"></div>
      <div class="start-row">
        <button class="menu-btn small" id="btn-back-char">← 重选角色</button>
        <button class="menu-btn" id="btn-start">⚔️ 锁定并开始对决</button>
      </div>
    </section>
  </div>

  <script src="data/gamedata.js?v=9"></script>
  <script src="data/maps.js?v=9"></script>
  <script src="game.js?v=9"></script>
</body>
</html>
